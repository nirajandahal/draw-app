<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#EAF0FB">
<title>Draw</title>
<style>
/* Drop Fredoka-*.woff2 into www/fonts/ to get the rounded look offline.
   Without those files the app falls back to the system UI font. */
@font-face {
    font-family: 'Fredoka';
    src: url('fonts/Fredoka-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'Fredoka';
    src: url('fonts/Fredoka-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
}
@font-face {
    font-family: 'Fredoka';
    src: url('fonts/Fredoka-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
}

:root {
    --bg: #EAF0FB;
    --card: #FFFFFF;
    --line: #D6DFF0;
    --text: #27303F;
    --muted: #6E7A8E;
    --accent: #4C6FFF;
    --danger: #F4623A;
    --r: 18px;
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

html, body { height: 100%; overscroll-behavior: none; }

body {
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
}

.app {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .01em;
}

.title svg { color: var(--accent); }

.bar-actions { display: flex; gap: 8px; }

.bar-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 42px;
    padding: 0 14px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .12s ease, border-color .18s ease;
}

.bar-btn:active { transform: scale(.94); }
.bar-btn:disabled { opacity: .4; pointer-events: none; }
.bar-btn.danger { color: var(--danger); }
.bar-btn.save { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- canvas ---------- */

.stage { position: relative; min-height: 0; display: grid; place-items: center; }

.paper {
    position: relative;
    line-height: 0;
    border-radius: var(--r);
    overflow: hidden;
    background: #fff;
    box-shadow: 0 10px 24px -10px rgba(39, 48, 63, .28);
}

#bgCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#canvas { position: relative; display: block; touch-action: none; }

.photo-chip {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .95);
    border: 2px solid var(--line);
    font-size: 13px;
    font-weight: 500;
}

.photo-chip.on { display: flex; }

.photo-chip button {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: var(--bg);
    color: var(--muted);
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
}

/* ---------- dock ---------- */

.dock {
    display: grid;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
}

.row-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
}

.colors {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 3px;
    scrollbar-width: none;
}

.colors::-webkit-scrollbar { display: none; }

.color {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--line);
    cursor: pointer;
    transition: transform .14s ease;
}

.color:active { transform: scale(.9); }
.color.active { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.08); }

.color.custom {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--bg);
    color: var(--muted);
}

.color.custom svg { width: 18px; height: 18px; pointer-events: none; }
.color.custom input { position: absolute; inset: -4px; opacity: 0; cursor: pointer; }

/* size + tools share the same button look */

.sizes { display: flex; gap: 8px; }

.size-btn {
    flex: 1;
    height: 48px;
    display: grid;
    place-items: center;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    cursor: pointer;
    transition: transform .12s ease, border-color .18s ease, background .18s ease;
}

.size-btn:active { transform: scale(.95); }
.size-btn .dot { border-radius: 50%; background: var(--text); }
.size-btn.active { background: var(--accent); border-color: var(--accent); }
.size-btn.active .dot { background: #fff; }

.tools { display: flex; gap: 8px; }

.tool {
    flex: 1;
    height: 66px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .12s ease, border-color .18s ease, background .18s ease;
}

.tool:active { transform: scale(.95); }
.tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 380px) {
    .bar-btn span { display: none; }
    .bar-btn { padding: 0 12px; }
    .tool { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">

    <header class="bar">
        <div class="title">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L9 16l-4 1 1-4z"/><path d="M13 6l5 5"/></svg>
            Draw
        </div>
        <div class="bar-actions">
            <button class="bar-btn" id="undoBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
                <span>Undo</span>
            </button>
            <button class="bar-btn danger" id="clearBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
                <span>Clear</span>
            </button>
            <button class="bar-btn save" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>
                <span>Save</span>
            </button>
        </div>
    </header>

    <main class="stage" id="stage">
        <div class="paper" id="paper">
            <canvas id="bgCanvas"></canvas>
            <canvas id="canvas"></canvas>
        </div>
        <div class="photo-chip" id="photoChip">
            Photo added
            <button id="removePhotoBtn" aria-label="Remove photo">&times;</button>
        </div>
    </main>

    <section class="dock">

        <div>
            <div class="row-label">Colour</div>
            <div class="colors" id="colors"></div>
        </div>

        <div>
            <div class="row-label">Size</div>
            <div class="sizes" id="sizes"></div>
        </div>

        <div class="tools">
            <button class="tool active" data-tool="brush">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L9 16l-4 1 1-4z"/><path d="M13 6l5 5"/></svg>
                Brush
            </button>
            <button class="tool" data-tool="eraser">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5 11 9.5a2 2 0 0 1 2.8 0l4.7 4.7a2 2 0 0 1 0 2.8L16 19.5H8z"/><path d="M9 19.5h11"/></svg>
                Eraser
            </button>
            <button class="tool" data-tool="fill">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 4.6 8.9a2 2 0 0 0 0 2.9l4.6 4.6a2 2 0 0 0 2.9 0l5.4-5.4z"/><path d="m7.5 6 6 6"/><path d="M19.5 16.5c0 1.1-.9 2-2 2s-2-.9-2-2 2-3.5 2-3.5 2 2.4 2 3.5"/></svg>
                Fill
            </button>
            <button class="tool" id="uploadBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 4 4 2.5-2.5L20 17"/></svg>
                Photo
            </button>
            <input type="file" id="photoInput" accept="image/*" hidden>
        </div>

    </section>
</div>

<script>
// How far a pixel's colour may drift from the tapped pixel and still be filled.
// Strokes are anti-aliased, so 0 leaves a halo around every line. Raise it if
// fills leave an outline, lower it if colour leaks past thin lines.
const FILL_TOLERANCE = 32;

// Caps the canvas pixel buffer. Every undo step is a full-size snapshot, so
// this and MAX_UNDO together set the app's memory ceiling.
const MAX_CANVAS_EDGE = 1280;
const MAX_UNDO = 10;

const COLOURS = ['#1A1A1A', '#FFFFFF', '#E23D3D', '#F5821F', '#FFC93C',
                 '#4CAF50', '#2E86DE', '#7C5CFF', '#FF6FB5', '#8B5E3C'];

const SIZES = [4, 10, 20, 34];

class DrawingCanvas {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        this.bgCanvas = document.getElementById('bgCanvas');
        this.bgCtx = this.bgCanvas.getContext('2d');

        // Offscreen layer used to flatten photo + drawing before a fill.
        this.flatCanvas = document.createElement('canvas');
        this.flatCtx = this.flatCanvas.getContext('2d', { willReadFrequently: true });

        this.paper = document.getElementById('paper');
        this.stage = document.getElementById('stage');

        this.tool = 'brush';
        this.colour = COLOURS[0];
        this.size = SIZES[1];
        this.isDrawing = false;
        this.lastX = 0;
        this.lastY = 0;
        this.photo = null;
        this.undoStack = [];

        this.buildColours();
        this.buildSizes();
        this.bindEvents();
        this.fitCanvas();
        this.setColour(this.colour);
        this.setSize(this.size);
    }

    /* ---------- sizing ---------- */

    fitCanvas() {
        const availW = this.stage.clientWidth;
        const availH = this.stage.clientHeight;
        if (!availW || !availH) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let w = Math.round(availW * dpr);
        let h = Math.round(availH * dpr);

        const shrink = Math.min(1, MAX_CANVAS_EDGE / Math.max(w, h));
        w = Math.round(w * shrink);
        h = Math.round(h * shrink);

        // Keep whatever is already drawn, rescaled into the new buffer.
        const previous = this.canvas.width ? this.snapshot() : null;

        [this.canvas, this.bgCanvas, this.flatCanvas].forEach((c) => {
            c.width = w;
            c.height = h;
        });

        this.paper.style.width = availW + 'px';
        this.paper.style.height = availH + 'px';
        this.canvas.style.width = availW + 'px';
        this.canvas.style.height = availH + 'px';

        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';

        if (previous) this.ctx.drawImage(previous, 0, 0, w, h);
        if (this.photo) this.paintPhoto();
    }

    snapshot() {
        const copy = document.createElement('canvas');
        copy.width = this.canvas.width;
        copy.height = this.canvas.height;
        copy.getContext('2d').drawImage(this.canvas, 0, 0);
        return copy;
    }

    /* ---------- setup ---------- */

    buildColours() {
        const wrap = document.getElementById('colors');

        COLOURS.forEach((hex) => {
            const b = document.createElement('button');
            b.className = 'color';
            b.dataset.colour = hex;
            b.style.background = hex;
            b.setAttribute('aria-label', 'Colour ' + hex);
            b.addEventListener('click', () => this.setColour(hex));
            wrap.appendChild(b);
        });

        const custom = document.createElement('label');
        custom.className = 'color custom';
        custom.title = 'More colours';
        custom.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>' +
            '<input type="color" id="colourPicker" value="#1A1A1A" aria-label="Pick a colour">';
        wrap.appendChild(custom);
        custom.querySelector('input').addEventListener('input', (e) => this.setColour(e.target.value));
    }

    buildSizes() {
        const wrap = document.getElementById('sizes');
        SIZES.forEach((size) => {
            const b = document.createElement('button');
            b.className = 'size-btn';
            b.dataset.size = size;
            b.setAttribute('aria-label', 'Brush size ' + size);
            const dot = Math.round(size * 0.7) + 6;
            b.innerHTML = `<span class="dot" style="width:${dot}px;height:${dot}px"></span>`;
            b.addEventListener('click', () => this.setSize(size));
            wrap.appendChild(b);
        });
    }

    bindEvents() {
        this.canvas.addEventListener('pointerdown', (e) => this.onDown(e));
        this.canvas.addEventListener('pointermove', (e) => this.onMove(e));
        this.canvas.addEventListener('pointerup', () => this.stop());
        this.canvas.addEventListener('pointercancel', () => this.stop());
        this.canvas.addEventListener('pointerleave', () => this.stop());

        document.querySelectorAll('[data-tool]').forEach((btn) => {
            btn.addEventListener('click', () => this.setTool(btn.dataset.tool));
        });

        const input = document.getElementById('photoInput');
        document.getElementById('uploadBtn').addEventListener('click', () => input.click());
        input.addEventListener('change', (e) => this.loadPhoto(e.target.files[0]));
        document.getElementById('removePhotoBtn').addEventListener('click', () => this.removePhoto());

        document.getElementById('undoBtn').addEventListener('click', () => this.undo());
        document.getElementById('clearBtn').addEventListener('click', () => this.clearDrawing());
        document.getElementById('downloadBtn').addEventListener('click', () => this.download());

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => this.fitCanvas(), 180);
        });
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (this.canvas.width / rect.width),
            y: (e.clientY - rect.top) * (this.canvas.height / rect.height)
        };
    }

    /* ---------- drawing ---------- */

    onDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        this.canvas.setPointerCapture?.(e.pointerId);

        const pos = this.getPos(e);
        this.saveState();

        if (this.tool === 'fill') {
            this.floodFill(Math.floor(pos.x), Math.floor(pos.y));
            return;
        }

        this.isDrawing = true;
        this.lastX = pos.x;
        this.lastY = pos.y;
        this.drawTo(pos.x, pos.y); // a tap leaves a dot
    }

    onMove(e) {
        if (!this.isDrawing) return;
        const pos = this.getPos(e);
        this.drawTo(pos.x, pos.y);
    }

    drawTo(x, y) {
        const scale = this.canvas.width / this.canvas.getBoundingClientRect().width;
        this.ctx.globalCompositeOperation = this.tool === 'eraser' ? 'destination-out' : 'source-over';
        this.ctx.strokeStyle = this.colour;
        this.ctx.lineWidth = this.size * scale;

        this.ctx.beginPath();
        this.ctx.moveTo(this.lastX, this.lastY);
        this.ctx.lineTo(x, y);
        this.ctx.stroke();

        this.lastX = x;
        this.lastY = y;
    }

    stop() {
        this.isDrawing = false;
    }

    /* ---------- fill ---------- */

    // Boundaries come from the flattened image (photo + strokes) so filling works
    // on an uploaded colouring page; pixels are written only to the drawing layer.
    floodFill(startX, startY) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        if (startX < 0 || startY < 0 || startX >= w || startY >= h) return;

        this.flatCtx.globalCompositeOperation = 'source-over';
        this.flatCtx.fillStyle = '#fff';
        this.flatCtx.fillRect(0, 0, w, h);
        this.flatCtx.drawImage(this.bgCanvas, 0, 0);
        this.flatCtx.drawImage(this.canvas, 0, 0);

        const refPx = this.flatCtx.getImageData(0, 0, w, h).data;
        const layer = this.ctx.getImageData(0, 0, w, h);
        const outPx = layer.data;

        const s = (startY * w + startX) * 4;
        const tr = refPx[s], tg = refPx[s + 1], tb = refPx[s + 2];
        const fill = this.hexToRgb(this.colour);

        if (Math.abs(tr - fill.r) <= 1 && Math.abs(tg - fill.g) <= 1 && Math.abs(tb - fill.b) <= 1) return;

        const visited = new Uint8Array(w * h);
        const matches = (x, y) => {
            const p = y * w + x;
            if (visited[p]) return false;
            const i = p * 4;
            return Math.abs(refPx[i] - tr) <= FILL_TOLERANCE &&
                   Math.abs(refPx[i + 1] - tg) <= FILL_TOLERANCE &&
                   Math.abs(refPx[i + 2] - tb) <= FILL_TOLERANCE;
        };

        const stack = [[startX, startY]];
        while (stack.length) {
            const [sx, sy] = stack.pop();
            let x = sx;
            while (x >= 0 && matches(x, sy)) x--;
            x++;

            let spanAbove = false;
            let spanBelow = false;
            while (x < w && matches(x, sy)) {
                const p = sy * w + x;
                const i = p * 4;
                outPx[i] = fill.r;
                outPx[i + 1] = fill.g;
                outPx[i + 2] = fill.b;
                outPx[i + 3] = 255;
                visited[p] = 1;

                if (sy > 0) {
                    const above = matches(x, sy - 1);
                    if (above && !spanAbove) { stack.push([x, sy - 1]); spanAbove = true; }
                    else if (!above) { spanAbove = false; }
                }
                if (sy < h - 1) {
                    const below = matches(x, sy + 1);
                    if (below && !spanBelow) { stack.push([x, sy + 1]); spanBelow = true; }
                    else if (!below) { spanBelow = false; }
                }
                x++;
            }
        }

        this.ctx.putImageData(layer, 0, 0);
    }

    hexToRgb(hex) {
        const v = parseInt(hex.slice(1), 16);
        return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }

    /* ---------- photo ---------- */

    loadPhoto(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                this.photo = img;
                this.paintPhoto();
                document.getElementById('photoChip').classList.add('on');
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
        document.getElementById('photoInput').value = ''; // allow re-picking the same file
    }

    paintPhoto() {
        const w = this.bgCanvas.width;
        const h = this.bgCanvas.height;
        const img = this.photo;
        const scale = Math.min(w / img.width, h / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;

        this.bgCtx.clearRect(0, 0, w, h);
        this.bgCtx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }

    removePhoto() {
        this.photo = null;
        this.bgCtx.clearRect(0, 0, this.bgCanvas.width, this.bgCanvas.height);
        document.getElementById('photoChip').classList.remove('on');
    }

    /* ---------- tools, colour, size ---------- */

    setTool(tool) {
        this.tool = tool;
        document.querySelectorAll('[data-tool]').forEach((btn) => {
            btn.classList.toggle('active', btn.dataset.tool === tool);
        });
    }

    setColour(hex) {
        this.colour = hex;
        if (this.tool === 'eraser') this.setTool('brush');

        document.querySelectorAll('.color[data-colour]').forEach((c) => {
            c.classList.toggle('active', c.dataset.colour.toLowerCase() === hex.toLowerCase());
        });
        document.getElementById('colourPicker').value = hex;
    }

    setSize(size) {
        this.size = size;
        document.querySelectorAll('.size-btn').forEach((b) => {
            b.classList.toggle('active', Number(b.dataset.size) === size);
        });
    }

    /* ---------- history and output ---------- */

    saveState() {
        this.undoStack.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height));
        if (this.undoStack.length > MAX_UNDO) this.undoStack.shift();
        document.getElementById('undoBtn').disabled = false;
    }

    undo() {
        const previous = this.undoStack.pop();
        if (previous && previous.width === this.canvas.width) {
            this.ctx.putImageData(previous, 0, 0);
        }
        document.getElementById('undoBtn').disabled = this.undoStack.length === 0;
    }

    clearDrawing() {
        if (!confirm('Clear the drawing? Your photo stays.')) return;
        this.saveState();
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }

    flatten() {
        const merged = document.createElement('canvas');
        merged.width = this.canvas.width;
        merged.height = this.canvas.height;
        const m = merged.getContext('2d');

        m.fillStyle = '#fff';
        m.fillRect(0, 0, merged.width, merged.height);
        m.drawImage(this.bgCanvas, 0, 0);
        m.drawImage(this.canvas, 0, 0);
        return merged;
    }

    // An <a download> click does nothing inside an Android WebView, so on device
    // the PNG is written to the cache and handed to the system share sheet.
    async download() {
        const dataUrl = this.flatten().toDataURL('image/png');
        const cap = window.Capacitor;

        if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) {
            const link = document.createElement('a');
            link.download = 'drawing.png';
            link.href = dataUrl;
            link.click();
            return;
        }

        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        try {
            const { Filesystem, Share } = cap.Plugins;
            const name = 'drawing-' + Date.now() + '.png';
            const written = await Filesystem.writeFile({
                path: name,
                data: dataUrl.split(',')[1],
                directory: 'CACHE'
            });
            await Share.share({
                title: 'My drawing',
                dialogTitle: 'Save or share your drawing',
                files: [written.uri]
            });
        } catch (err) {
            if (!String(err).toLowerCase().includes('cancel')) {
                alert('Could not save the drawing. Please try again.');
            }
        } finally {
            btn.disabled = false;
        }
    }
}

window.addEventListener('load', () => {
    document.getElementById('undoBtn').disabled = true;
    new DrawingCanvas();
});
</script>
