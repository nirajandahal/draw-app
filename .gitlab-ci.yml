stages:
  - build

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Bump this if Google retires the build: see
  # https://developer.android.com/studio#command-line-tools-only
  CMDLINE_TOOLS: "11076825"
  # Must match compileSdkVersion / targetSdkVersion in android/variables.gradle
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

debug-apk:
  stage: build
  image: node:22-bookworm
  # First run downloads the SDK and Gradle (~6-8 min). Later runs hit the cache.
  cache:
    key: android-toolchain
    paths:
      - .android-sdk/
      - .gradle/caches/
      - .gradle/wrapper/
      - node_modules/
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless unzip > /dev/null
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
        echo "Installing Android command line tools..."
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sSfL "https://dl.google.com/android/repository/commandline-tools-linux-${CMDLINE_TOOLS}_latest.zip" -o /tmp/tools.zip
        unzip -q /tmp/tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" > /dev/null
  script:
    - npm ci
    - npx cap sync android
    - chmod +x android/gradlew
    - cd android && ./gradlew assembleDebug --no-daemon --console=plain
  artifacts:
    name: "draw-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
